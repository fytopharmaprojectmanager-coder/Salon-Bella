name: Publikovať web na GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nástroje na zmenšenie fotiek a videa
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp ffmpeg
      - name: Pripraviť web
        run: |
          mkdir -p _site
          cp index.html _site/
          mkdir -p _site/img && cp img/favicon.png _site/img/
          ./scripts/build-assets.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
